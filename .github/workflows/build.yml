name: Build BoatGen.exe
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r source/requirements.txt pyinstaller
      - name: Test generator
        run: python -c "import sys; sys.path.insert(0,'source'); from engine.gen import generate; [print(k, generate(k,'M','med','dark',1).info['bricks']) for k in ('motor','cutter','military')]"
      - name: Build exe
        run: pyinstaller --noconfirm --windowed --name BoatGen --icon source/assets/boatgen.ico --add-data "source/ui;ui" --add-data "source/engine/data;engine/data" source/app.py
      - name: Self-test exe
        shell: pwsh
        run: |
          $p = Start-Process dist/BoatGen/BoatGen.exe -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path dist/BoatGen/error.log) { Get-Content dist/BoatGen/error.log }
          if (-not (Test-Path dist/BoatGen/selftest.ok)) { exit 1 }
          Remove-Item dist/BoatGen/selftest.ok
      - name: Trim Qt files we do not need
        shell: pwsh
        run: |
          $q = "dist/BoatGen/_internal/PySide6"
          Get-ChildItem "$q/translations" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch '(_ru|_en|en-US|ru\.pak)' } | Remove-Item -Force
          Get-ChildItem "$q/translations/qtwebengine_locales" -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -notin @('en-US.pak','ru.pak') } | Remove-Item -Force
          foreach ($m in 'Qt6Pdf','Qt6Designer','Qt6Charts','Qt6DataVisualization','Qt63D*','Qt6Multimedia*','Qt6Bluetooth','Qt6Sensors','Qt6SerialPort','Qt6Test','Qt6Sql','Qt6Svg*','Qt6Xml') { Remove-Item "$q/$m.dll" -ErrorAction SilentlyContinue }
          "{0:N0} MB" -f ((Get-ChildItem dist/BoatGen -Recurse | Measure-Object Length -Sum).Sum / 1MB)
      - name: Window test (real Qt window)
        shell: pwsh
        run: |
          Remove-Item dist/BoatGen/error.log -ErrorAction SilentlyContinue
          $p = Start-Process dist/BoatGen/BoatGen.exe -ArgumentList "--guitest" -PassThru
          $p | Wait-Process -Timeout 120 -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { $p | Stop-Process -Force }
          $r = if (Test-Path dist/BoatGen/guitest.txt) { Get-Content dist/BoatGen/guitest.txt } else { "no result" }
          Write-Output "::notice title=guitest::$r"
          if (Test-Path dist/BoatGen/error.log) { $e = (Get-Content dist/BoatGen/error.log -Raw) -replace "`r?`n", '%0A'; Write-Output "::warning title=errorlog::$e" }
          Remove-Item dist/BoatGen/guitest.txt, dist/BoatGen/error.log, dist/BoatGen/settings.json -ErrorAction SilentlyContinue
          Remove-Item dist/BoatGen/window_profile -Recurse -ErrorAction SilentlyContinue
          if ($r -ne "ok") { exit 1 }
      - name: Generate test boats
        run: python -c "import sys; sys.path.insert(0,'source'); from engine.gen import generate; [print(k, s, d, generate(k,s,d,'dark',7).info['bricks']) for k in ('motor','cutter','military') for s in 'SML' for d in ('low','med','high')]"
      - name: Add readme
        shell: pwsh
        run: Copy-Item README_RU.txt dist/BoatGen/
      - uses: actions/upload-artifact@v4
        with:
          name: BoatGen
          path: dist/BoatGen
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/BoatGen -DestinationPath BoatGen-win.zip
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BoatGen (скачать)
          body: "Скачайте BoatGen-win.zip ниже, распакуйте и запустите BoatGen.exe"
          files: BoatGen-win.zip
          make_latest: true
